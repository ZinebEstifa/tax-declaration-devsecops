# ==============================================================================
# 🚀 DEVSECOPS DOCKER COMPOSE ORCHESTRATION - SIMPL-IS TAX DECLARATION SYSTEM
# ==============================================================================
# Architecture : PostgreSQL 16 (BDD) + Spring Boot (Backend) + Angular/Nginx (Frontend)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🐘 1. SERVICE BASE DE DONNÉES POSTGRESQL (PRODUCTION)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: simplis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pwd_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simplis-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # ☕ 2. SERVICE BACKEND (SPRING BOOT 3 / JAVA 17)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simplis-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taxdb
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_pwd_2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simplis-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 🅰️ 3. SERVICE FRONTEND (ANGULAR 19 / NGINX REVERSE PROXY)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simplis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - simplis-network
    ports:
      - "80:80"
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# 🌐 RESEAU ISOLE ET PERSISTANCE DE DONNEES
# ------------------------------------------------------------------------------
networks:
  simplis-network:
    driver: bridge
    name: simplis-devsecops-net

volumes:
  postgres_data:
    name: simplis-postgres-data
