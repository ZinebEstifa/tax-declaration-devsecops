# ==============================================================================
# 🛡️ DEVSECOPS NGINX CONFIGURATION - FRONTEND ANGULAR (SIMPL-IS)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # 🔒 EN-TÊTES DE SÉCURITÉ HTTP (HARDENING DEVSECOPS)
    # --------------------------------------------------------------------------
    # Protection contre le Clickjacking
    add_header X-Frame-Options "DENY" always;

    # Protection contre le MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Protection contre les attaques XSS
    add_header X-XSS-Protection "1; mode=block" always;

    # Politique de Referrer sécurisée
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP) optimisée pour Angular
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://backend:8080;" always;

    # Masquer la version de Nginx (Sécurité par l'obscurité)
    server_tokens off;

    # --------------------------------------------------------------------------
    # 🚀 OPTIMISATION & GZIP COMPRESSION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # --------------------------------------------------------------------------
    # 🅰️ ROUTAGE ANGULAR SPA (SINGLE PAGE APPLICATION)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 🔄 REVERSE PROXY VERS LE BACKEND SPRING BOOT
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de sécurité
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache pour les assets statiques
    location ~* \.(?:css|js|map|jpe?g|gif|png|svg|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Gestion des erreurs HTTP
    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
