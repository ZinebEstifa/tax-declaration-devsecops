# ==============================================================================
# ☸️ KUBERNETES MANIFEST - 01: CONFIGMAP & SECRETS
# ==============================================================================
# Séparation stricte de la configuration et des secrets sensibles (DevSecOps)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGMAP (Données de configuration non sensibles)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplis-config
  namespace: simpl-is
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "taxdb"

---
# ------------------------------------------------------------------------------
# 2. SECRET (Identifiants et Clés Cryptographiques - Chiffrés en base64)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: simplis-secrets
  namespace: simpl-is
type: Opaque
stringData:
  # Identifiants de la BDD PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_pwd_2026_k8s"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres_secure_pwd_2026_k8s"
  
  # Clés de sécurité applicative (JWT & Argon2id Pepper)
  JWT_SECRET: "c3VwZXJfc2VjcmV0X2p3dF9zaWduaW5nX2tleV9mb3JfZGV2c2Vjb3Bz"
  ARGON2_PEPPER: "c2ltcGxfaXNfc2VjcmV0X3BlcHBlcl9rZXlfMjAyNg=="
