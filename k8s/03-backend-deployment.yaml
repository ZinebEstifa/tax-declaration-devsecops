# ==============================================================================
# ☸️ KUBERNETES MANIFEST - 03: BACKEND SPRING BOOT (DEPLOYMENT, SERVICE & HPA)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DEPLOYMENT (Backend API Spring Boot 3.4 / Java 17 - DevSecOps Hardened)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: simpl-is
  labels:
    app: backend
    tier: api
    security.devsecops: "high"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      # 🔒 Sécurité du Pod (Non-root user custom: UID 10001)
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: simplis-backend:latest
          imagePullPolicy: IfNotPresent

          # 🔒 Sécurité du Conteneur (Durcissement DevSecOps)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Variables d'environnement injectées depuis ConfigMap et Secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: simplis-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: simplis-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: simplis-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: simplis-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: simplis-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simplis-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: simplis-secrets
                  key: JWT_SECRET
            - name: ARGON2_PEPPER
              valueFrom:
                secretKeyRef:
                  name: simplis-secrets
                  key: ARGON2_PEPPER

          ports:
            - containerPort: 8080
              name: http-api

          # Volume temporaire en RAM pour /tmp (nécessaire avec readOnlyRootFilesystem)
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          # Limites de ressources (Prévention des attaques DoS et épuisement mémoire)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # Probes de santé pour la résilience Kubernetes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 2

      volumes:
        - name: tmp-volume
          emptyDir: {}

---
# ------------------------------------------------------------------------------
# 2. SERVICE (Exposition interne du Backend API)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: simpl-is
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http-api
      protocol: TCP

---
# ------------------------------------------------------------------------------
# 3. HORIZONTAL POD AUTOSCALER (Passage à l'échelle automatique selon la charge CPU)
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: simpl-is
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
