name: 🔒 DevSecOps End-to-End Pipeline - SIMPL-IS (Shift-Left Security)

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # 🔒 ÉTAPE 1 : SÉCURITÉ DES SECRETS (Shift-Left Secret Leak Detection)
  # ============================================================================
  secret-scan:
    name: 🔑 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Détecter les fuites de secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # 🔒 ÉTAPE 2 : SÉCURITÉ DU BACKEND (SAST & Tests Cryptographiques Argon2id)
  # ============================================================================
  backend-devsecops:
    name: ☕ 2. Backend Security & Unit Tests
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☕ Configurer JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Tests d'intégration Sécurité (Argon2id, JWT, BruteForce)
        run: |
          cd backend
          mvn clean test -B

  # ============================================================================
  # 🔒 ÉTAPE 3 : SÉCURITÉ DU FRONTEND (Audit des dépendances & Build Angular 21)
  # ============================================================================
  frontend-devsecops:
    name: 🅰️ 3. Frontend Audit & Angular Build
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer les dépendances
        run: |
          cd frontend
          npm ci || npm install --legacy-peer-deps

      - name: 🛡️ Audit de sécurité des packages (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: 🏗️ Compilation Angular (Build Check)
        run: |
          cd frontend
          npx ng build --configuration=development

  # ============================================================================
  # 🔒 ÉTAPE 4 : SÉCURITÉ DES MANIFESTES KUBERNETES (IaC Security Scan)
  # ============================================================================
  iac-k8s-security:
    name: ☸️ 4. IaC Security Scan (K8s Misconfigurations)
    runs-on: ubuntu-latest
    needs: [backend-devsecops, frontend-devsecops]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Vérification Kustomize
        run: |
          kubectl kustomize k8s/

      - name: 🛡️ Scan de sécurité des manifestes K8s (Trivy IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s'
          hide-shortcut-table: true
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 🔒 ÉTAPE 5 : SÉCURITÉ DES CONTENEURS (Container Vulnerability Scan)
  # ============================================================================
  container-security:
    name: 🐳 5. Container Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [iac-k8s-security]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🐳 Build Image Backend
        run: docker build -t simplis-backend:ci ./backend

      - name: 🔍 Scan Sécurité Image Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-backend:ci'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Image Frontend
        run: docker build -t simplis-frontend:ci ./frontend

      - name: 🔍 Scan Sécurité Image Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-frontend:ci'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 🚀 ÉTAPE 6 : DÉPLOIEMENT SÉCURISÉ (Registry Push & K8s Deploy)
  # ============================================================================
  docker-push-deploy:
    name: 🚀 6. Secure Registry Push & K8s Deploy
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🔑 Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Push Image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: 🐳 Push Image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
