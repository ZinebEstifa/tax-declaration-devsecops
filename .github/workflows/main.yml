name: 🔒 DevSecOps CI/CD Pipeline - SIMPL-IS (Full CI/CD & Deploy)

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------------
  # 1. BUILD & TEST BACKEND (CI - Spring Boot & Tests)
  # ----------------------------------------------------------------------------
  backend-build-test:
    name: ☕ Build & Tests Backend (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☕ Configurer JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Compiler et lancer les 21 tests d'intégration
        run: |
          cd backend
          mvn clean test -B

  # ----------------------------------------------------------------------------
  # 2. BUILD FRONTEND (CI - Angular 19)
  # ----------------------------------------------------------------------------
  frontend-build:
    name: 🅰️ Build Frontend Angular 19
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer les dépendances & Compiler Angular
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production

  # ----------------------------------------------------------------------------
  # 3. SCAN DE SÉCURITÉ (SecOps - Trivy Vulnerability Scanner)
  # ----------------------------------------------------------------------------
  security-scan:
    name: 🛡️ Scan de Sécurité Trivy (Images Docker)
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🐳 Construire l'image Docker Backend
        run: docker build -t simplis-backend:ci ./backend

      - name: 🔍 Scanner l'image Backend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🐳 Construire l'image Docker Frontend
        run: docker build -t simplis-frontend:ci ./frontend

      - name: 🔍 Scanner l'image Frontend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 4. BUILD & PUSH DOCKER IMAGES (CD - Publication sur Registry Container)
  # ----------------------------------------------------------------------------
  docker-build-push:
    name: 📦 Build & Push Images Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🔑 Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push Image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: 🐳 Build & Push Image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  # ----------------------------------------------------------------------------
  # 5. DEPLOY TO KUBERNETES CLUSTER (CD - Déploiement K8s)
  # ----------------------------------------------------------------------------
  k8s-deploy:
    name: 🚀 Déploiement en Production (Kubernetes Cluster)
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☸️ Configurer Kubeconfig / Clé d'accès Cluster K8s
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: 🚀 Déployer tous les manifestes Kubernetes (kubectl apply)
        run: |
          kubectl apply -k k8s/

      - name: 🔍 Vérifier le statut du déploiement (Rollout Status)
        run: |
          kubectl rollout status deployment/postgres-deployment -n simpl-is --timeout=120s
          kubectl rollout status deployment/backend-deployment -n simpl-is --timeout=120s
          kubectl rollout status deployment/frontend-deployment -n simpl-is --timeout=120s
