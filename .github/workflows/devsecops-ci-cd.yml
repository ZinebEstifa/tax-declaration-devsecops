name: 🔒 DevSecOps CI/CD Pipeline - SIMPL-IS

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. BUILD & TEST BACKEND (JUnit, Argon2id, Spring Security)
  # ----------------------------------------------------------------------------
  backend-test:
    name: ☕ Backend Build & Security Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Integration Tests with Maven
        run: |
          cd backend
          mvn clean test -B

  # ----------------------------------------------------------------------------
  # 2. BUILD & TEST FRONTEND (Angular 19)
  # ----------------------------------------------------------------------------
  frontend-test:
    name: 🅰️ Frontend Build & Angular Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Angular App
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production

  # ----------------------------------------------------------------------------
  # 3. DEVSECOPS SECURITY SCAN (Trivy Container & Vulnerability Scanner)
  # ----------------------------------------------------------------------------
  security-scan:
    name: 🛡️ Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t simplis-backend:ci ./backend

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image
        run: docker build -t simplis-frontend:ci ./frontend

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 4. KUBERNETES MANIFEST VALIDATION (kubeval / kube-linter)
  # ----------------------------------------------------------------------------
  k8s-validation:
    name: ☸️ Kubernetes Manifests Dry-Run Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests Syntax
        run: |
          kubectl apply --dry-run=client -k k8s/
