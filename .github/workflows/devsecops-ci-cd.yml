name: 🔒 DevSecOps CI/CD Pipeline - SIMPL-IS (Full CI/CD & Deploy)

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------------
  # 1. BUILD & TEST BACKEND (CI - Spring Boot & Tests Java 17)
  # ----------------------------------------------------------------------------
  backend-build-test:
    name: ☕ Backend Build & Security Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☕ Configurer JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Compiler et lancer les 21 tests d'intégration
        run: |
          cd backend
          mvn clean test -B

  # ----------------------------------------------------------------------------
  # 2. BUILD FRONTEND (CI - Angular 21 avec Node.js 20)
  # ----------------------------------------------------------------------------
  frontend-build:
    name: 🅰️ Frontend Build & Angular Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 20 (Requis pour Angular 21)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer les dépendances & Compiler Angular
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

  # ----------------------------------------------------------------------------
  # 3. VALIDATION MANIFESTES KUBERNETES (Kustomize Dry-Run Validation)
  # ----------------------------------------------------------------------------
  k8s-validation:
    name: ☸️ Kubernetes Manifests Dry-Run Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Vérifier la validité des fichiers Kubernetes (Kustomize Build)
        run: |
          kubectl kustomize k8s/

  # ----------------------------------------------------------------------------
  # 4. SCAN DE SÉCURITÉ (SecOps - Trivy Vulnerability Scanner)
  # ----------------------------------------------------------------------------
  security-scan:
    name: 🛡️ Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build, k8s-validation]

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🐳 Construire l'image Docker Backend
        run: docker build -t simplis-backend:ci ./backend

      - name: 🔍 Scanner l'image Backend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🐳 Construire l'image Docker Frontend
        run: docker build -t simplis-frontend:ci ./frontend

      - name: 🔍 Scanner l'image Frontend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'simplis-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 5. BUILD & PUSH DOCKER IMAGES (CD - Publication Registry)
  # ----------------------------------------------------------------------------
  docker-build-push:
    name: 📦 Build & Push Images Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🔑 Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push Image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: 🐳 Build & Push Image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
